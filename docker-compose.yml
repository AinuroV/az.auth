version: '3.8'

services:
  az-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: az-auth-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s